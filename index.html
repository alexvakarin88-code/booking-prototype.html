<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онлайн-запись — прототип</title>
<style>
:root{--bg:#fff;--card:#f3f4f6;--tx:#1a1c20;--mu:#6b7280;--ac:#2a7de1;--on:#fff;--bd:#e1e4e8;--ok:#1f9d55;--no:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#212428;--tx:#eceef1;--mu:#9aa1ab;--ac:#4a9bff;--on:#0b0d10;--bd:#33373d;--ok:#3ec27a;--no:#ff7a7a}}
:root[data-theme="dark"]{--bg:#15171a;--card:#212428;--tx:#eceef1;--mu:#9aa1ab;--ac:#4a9bff;--on:#0b0d10;--bd:#33373d;--ok:#3ec27a;--no:#ff7a7a}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h3{font-size:15px;margin:20px 0 8px}.mu{color:var(--mu);font-size:14px}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;margin:14px 0}
.tabs button{flex:1;border:0;border-radius:9px;padding:9px;background:none;color:var(--tx);font:inherit;cursor:pointer}
.tabs .on{background:var(--ac);color:var(--on)}
.g{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap}
.c{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;cursor:pointer}
.c span{color:var(--mu);font-size:14px}.c.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.p{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.p.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.p:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.b{width:100%;border:0;border-radius:12px;padding:14px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.card{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.ok{color:var(--ok);font-weight:600}.no{color:var(--no);background:none;border:0;font:inherit;cursor:pointer;padding:0}
.err{color:var(--no);font-size:14px;min-height:20px}
</style></head><body><div id="app"></div>
<script>
var S=[["Маникюр + покрытие",1800,90],["Коррекция бровей",900,40],["Ламинирование бровей",1500,60]],
T=["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"],
st={tab:"c",svc:0,day:0,time:null,name:"",phone:"",err:"",done:null,msg:""},B=[],K="demo_bookings_v1";
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();var u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u)st.name=u.first_name||""}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function day(i){var d=new Date();d.setDate(d.getDate()+i);return d}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var r=localStorage.getItem(K);if(r){B=JSON.parse(r);return}}catch(e){}
B=[{id:1,s:0,d:ymd(day(1)),t:"11:00",n:"Мария",p:"+7 900 111-22-33"},{id:2,s:1,d:ymd(day(1)),t:"14:00",n:"Ольга",p:"+7 900 444-55-66"}]}
function save(){try{localStorage.setItem(K,JSON.stringify(B))}catch(e){}}
function taken(d,t){return B.some(function(b){return b.d===d&&b.t===t})}
function draw(){var a=document.getElementById("app");
var h='<h1>Мастер Анна</h1><div class="mu">Маникюр и брови · запись онлайн</div><div class="tabs"><button class="'+(st.tab=="c"?"on":"")+'" onclick="st.tab=\'c\';draw()">Клиент</button><button class="'+(st.tab=="m"?"on":"")+'" onclick="st.tab=\'m\';draw()">Мастер ('+B.length+')</button></div>';
h+=st.tab=="c"?client():master();a.innerHTML=h}
function client(){
if(st.done){var b=st.done;return '<div class="card"><div class="ok">Вы записаны ✓</div><p>'+esc(S[b.s][0])+'<br>'+new Date(b.d).toLocaleDateString("ru",{weekday:"long",day:"numeric",month:"long"})+' в '+b.t+'<br>'+S[b.s][1]+' ₽</p><div class="mu">Мастер получит уведомление в Telegram.</div></div><button class="b s" onclick="st.done=null;st.time=null;draw()">Записаться ещё</button>'}
var h='<h3>1. Услуга</h3><div class="g">'+S.map(function(s,i){return '<button class="c '+(i==st.svc?"on":"")+'" onclick="st.svc='+i+';draw()"><b>'+s[0]+'</b><span>'+s[1]+' ₽ · '+s[2]+' мин</span></button>'}).join("")+'</div>';
h+='<h3>2. День</h3><div class="row">'+[0,1,2,3,4,5,6].map(function(i){return '<button class="p '+(i==st.day?"on":"")+'" onclick="st.day='+i+';st.time=null;draw()">'+day(i).toLocaleDateString("ru",{weekday:"short",day:"numeric"})+'</button>'}).join("")+'</div>';
var d=ymd(day(st.day));
h+='<h3>3. Время</h3><div class="row">'+T.map(function(t){return '<button class="p '+(t==st.time?"on":"")+'" '+(taken(d,t)?"disabled":"")+' onclick="st.time=\''+t+'\';draw()">'+t+'</button>'}).join("")+'</div>';
h+='<h3>4. Контакты</h3><input placeholder="Ваше имя" value="'+esc(st.name)+'" oninput="st.name=this.value"><input placeholder="Телефон" inputmode="tel" value="'+esc(st.phone)+'" oninput="st.phone=this.value"><div class="err">'+st.err+'</div><button class="b" onclick="book()">Записаться</button>';
return h}
function book(){if(!st.time){st.err="Выберите время";return draw()}
if(st.name.trim().length<2||st.phone.replace(/\D/g,"").length<10){st.err="Укажите имя и телефон";return draw()}
var b={id:Date.now(),s:st.svc,d:ymd(day(st.day)),t:st.time,n:st.name.trim(),p:st.phone.trim()};
B.push(b);save();st.err="";st.done=b;draw()}
function cancel(id){B=B.filter(function(b){return b.id!==id});save();draw()}
function copy(){var l=location.href;try{navigator.clipboard.writeText(l).then(function(){st.msg="Ссылка скопирована";draw()},function(){st.msg=l;draw()})}catch(e){st.msg=l;draw()}}
function master(){var L=B.slice().sort(function(a,b){return(a.d+a.t)<(b.d+b.t)?-1:1});
var h='<h3>Записи</h3>'+(L.length?L.map(function(b){return '<div class="card"><b>'+new Date(b.d).toLocaleDateString("ru",{weekday:"short",day:"numeric",month:"short"})+', '+b.t+'</b> · '+esc(S[b.s][0])+'<div class="mu">'+esc(b.n)+' · '+esc(b.p)+'</div><button class="no" onclick="cancel('+b.id+')">Отменить запись</button></div>'}).join(""):'<div class="mu">Пока записей нет</div>');
h+='<h3>Ссылка для клиентов</h3><div class="mu">Отправьте её в Telegram-чаты и группы: клиенты сами выберут свободное время.</div><button class="b" onclick="copy()">Скопировать ссылку</button><div class="mu" style="margin-top:8px;word-break:break-all">'+esc(st.msg)+'</div>';
h+='<div class="mu" style="margin-top:16px">Демо: данные хранятся только в вашем браузере.</div>';return h}
load();draw();
</script></body></html>
